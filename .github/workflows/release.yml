name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: 1ls-darwin-arm64
          - os: macos-15-intel
            artifact: 1ls-darwin-x64
          - os: ubuntu-latest
            artifact: 1ls-linux-x64
          - os: ubuntu-24.04-arm
            artifact: 1ls-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d
        with:
          nub-version: 0.7.5
          node-version: 26
          cache: pnpm

      - name: Install clang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scriptc coverage
        run: pnpm run scriptc:coverage

      - name: Build scriptc binary
        run: |
          mkdir -p dist
          nub --node ./node_modules/scriptc/dist/bootstrap.js build ./src/scriptc/index.ts --dynamic --no-keep-c -o ./dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d
        with:
          nub-version: 0.7.5
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Flatten artifacts
        run: |
          for artifact in 1ls-darwin-arm64 1ls-darwin-x64 1ls-linux-x64 1ls-linux-arm64; do
            mv "./dist/${artifact}/${artifact}" "./dist/${artifact}.tmp"
            rm -rf "./dist/${artifact}"
            mv "./dist/${artifact}.tmp" "./dist/${artifact}"
          done

      - name: Generate release manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}" pnpm run release:manifest

      - name: Calculate checksums and update formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SHA_ARM64=$(shasum -a 256 ./dist/1ls-darwin-arm64 | cut -d ' ' -f 1)
          SHA_X64=$(shasum -a 256 ./dist/1ls-darwin-x64 | cut -d ' ' -f 1)
          SHA_LINUX_X64=$(shasum -a 256 ./dist/1ls-linux-x64 | cut -d ' ' -f 1)
          SHA_LINUX_ARM64=$(shasum -a 256 ./dist/1ls-linux-arm64 | cut -d ' ' -f 1)
          MANIFEST_SHA=$(shasum -a 256 ./dist/release-manifest.json | cut -d ' ' -f 1)

          echo "=== Checksums ==="
          echo "VERSION: ${VERSION}"
          echo "SHA_ARM64: ${SHA_ARM64}"
          echo "SHA_X64: ${SHA_X64}"
          echo "SHA_LINUX_X64: ${SHA_LINUX_X64}"
          echo "SHA_LINUX_ARM64: ${SHA_LINUX_ARM64}"
          echo "MANIFEST_SHA: ${MANIFEST_SHA}"

          echo "=== Formula before sed ==="
          cat Formula/onels.rb

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/onels.rb
          sed -i '' "s/sha256 \".*\" # arm64/sha256 \"${SHA_ARM64}\" # arm64/" Formula/onels.rb
          sed -i '' "s/sha256 \".*\" # x64/sha256 \"${SHA_X64}\" # x64/" Formula/onels.rb
          sed -i '' "s/sha256 \".*\" # linux-x64/sha256 \"${SHA_LINUX_X64}\" # linux-x64/" Formula/onels.rb
          sed -i '' "s/sha256 \".*\" # linux-arm64/sha256 \"${SHA_LINUX_ARM64}\" # linux-arm64/" Formula/onels.rb

          echo "=== Formula after sed ==="
          cat Formula/onels.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/1ls-darwin-arm64
            ./dist/1ls-darwin-x64
            ./dist/1ls-linux-x64
            ./dist/1ls-linux-arm64
            ./dist/release-manifest.json
          generate_release_notes: true
          body: |
            ## Install

            ### Homebrew (macOS/Linux)
            ```bash
            brew install yowainwright/tap/1ls
            ```

            ### pnpm
            ```bash
            pnpm add -g 1ls
            ```

            ### curl
            ```bash
            curl -fsSL https://raw.githubusercontent.com/yowainwright/1ls/main/scripts/install.sh | bash
            ```

            ### Binary Downloads
            - `1ls-darwin-arm64` - macOS Apple Silicon
            - `1ls-darwin-x64` - macOS Intel
            - `1ls-linux-x64` - Linux x64
            - `1ls-linux-arm64` - Linux ARM64
            - `release-manifest.json` - asset checksums for automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push formula to tap repo
        env:
          GH_TOKEN: ${{ secrets.PR_CREATE_TOKEN }}
        run: |
          set -x
          TAP_REPO="https://x-access-token:${GH_TOKEN}@github.com/yowainwright/homebrew-tap.git"

          git clone "$TAP_REPO" ../homebrew-tap
          cd ../homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p Formula Aliases
          echo "=== Copying formula from workspace ==="
          cp ${{ github.workspace }}/Formula/onels.rb Formula/onels.rb
          ln -sf ../Formula/onels.rb Aliases/1ls

          echo "=== Formula content in tap repo ==="
          cat Formula/onels.rb

          if [ ! -f README.md ]; then
            echo "# Homebrew Tap" > README.md
            echo "" >> README.md
            echo "## Install" >> README.md
            echo "\`\`\`bash" >> README.md
            echo "brew install yowainwright/tap/1ls" >> README.md
            echo "\`\`\`" >> README.md
          fi

          git add .
          echo "=== Git status ==="
          git status
          git commit -m "chore: update 1ls formula to ${{ github.ref_name }}" || echo "No changes to commit"
          git push -u origin main
